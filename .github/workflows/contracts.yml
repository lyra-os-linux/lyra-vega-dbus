name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Controlled failure for branch-protection qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'test/ci-protection-1'
        run: |
          echo "Issue 1: allow time to verify pending-check merge rejection."
          sleep 45
          echo "::error::Intentional CI protection probe; remove before merge."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - name: Install private-bus test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon
      - name: Verify reproducible contract crate
        run: |
          cargo test --locked
          python3 -m unittest discover -s tests -v
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: [vega, vega-web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lyra-vega-dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyra-os-linux/${{ matrix.repository }}
          path: consumer
      - name: Verify consumer pins an explicit contract revision
        env:
          CONSUMER: ${{ matrix.repository }}
        run: ./lyra-vega-dbus/scripts/check-consumer-pin.sh "consumer" "$CONSUMER"

  daemon-contract:
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/leap:16.0
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install integration tools on the daemon's supported distro
        run: >-
          zypper --non-interactive install --no-recommends
          bash ca-certificates curl git tar gzip xz gcc make gettext-tools
          dbus-1-daemon systemd util-linux polkit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lyra-vega-dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyra-os-linux/vegad
          path: vegad
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: vegad/go.mod
          cache-dependency-path: vegad/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.92"
      - name: Verify vegad against the canonical D-Bus contract
        run: ./vegad/scripts/test-dbus-integration.sh
